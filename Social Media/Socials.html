<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Socials | Kyo's Delivery Service</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --color-bg: #212227;
      --color-accent: #C60F7B;
      --color-highlight: #B986CF;
      --color-primary: #09C8C9;
      --color-light: #5AD6F5;
      --color-title: #B4ADEA;
      --color-soft-pink: #BD5EB3;
      --color-purple: #C23797;
    }

    body {
      background-color: var(--color-bg);
      color: white;
    }

    .navbar {
      background-color: var(--color-bg);
    }

    .navbar-brand,
    .nav-link {
      color: var(--color-light) !important;
    }

    .nav-link:hover {
      color: var(--color-accent) !important;
    }

    .social-btn {
      margin: 0.5rem;
    }

    .post-embed {
      background: linear-gradient(135deg, var(--color-highlight), var(--color-bg));
      border-radius: 12px;
      padding: 1rem;
      color: #fff;
    }

    .footer {
      background-color: var(--color-bg);
      color: var(--color-soft-pink);
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">Kyo's Delivery Service</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="catalogue.html">Catalogue</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <div class="container text-center py-5">
    <h1 class="display-5 mb-3" style="color: var(--color-title);">Find Me Online</h1>
    <p class="lead">Stay up to date with the latest artworks, prints and sneak peeks behind the scenes!</p>

    <!-- Social Buttons -->
    <div class="d-flex justify-content-center flex-wrap mt-4">
      <a href="https://www.instagram.com/yourname" target="_blank" class="btn btn-outline-light social-btn">
        <i class="bi bi-instagram me-2"></i>Instagram
      </a>
      <a href="https://www.etsy.com/shop/yourshop" target="_blank" class="btn btn-outline-light social-btn">
        <i class="bi bi-shop me-2"></i>Etsy Shop
      </a>
      <a href="https://ko-fi.com/yourname" target="_blank" class="btn btn-outline-light social-btn">
        <i class="bi bi-cup-hot me-2"></i>Ko-Fi
      </a>
      <a href="mailto:youremail@example.com" class="btn btn-outline-light social-btn">
        <i class="bi bi-envelope me-2"></i>Email Me
      </a>
    </div>
  </div>

  <!-- Newest Posts -->
  <div class="container py-5">
    <h2 class="text-center mb-4" style="color: var(--color-title);">Newest Posts</h2>
      <div class="col">
        <div class="post-embed">
          <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/p/DMCzhWqMqKQ" data-instgrm-version="14"
            style=" background:#000; border-radius:12px; padding:0; ">
          </blockquote>
        </div>
      </div>
  </div>

  <!-- Footer -->
  <footer class="text-center py-4 footer">
    <p class="mb-0">&copy; 2025 Kyo's Delivery Service — All Rights Reserved.</p>
  </footer>

  <!-- Scripts -->
  <script async src="//www.instagram.com/embed.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
