<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <title>Catalogue | Kyo's Delivery Service</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --color-bg: #212227;
      --color-accent: #C60F7B;
      --color-highlight: #B986CF;
      --color-primary: #09C8C9;
      --color-light: #5AD6F5;
      --color-title: #B4ADEA;
      --color-soft-pink: #BD5EB3;
      --color-purple: #C23797;
    }

    body {
      background-color: var(--color-bg);
      color: #ffffff;
    }

    .navbar {
      background-color: var(--color-bg);
    }

    .navbar-brand,
    .nav-link {
      color: var(--color-light) !important;
    }

    .navbar-brand:hover,
    .nav-link:hover {
      color: var(--color-accent) !important;
    }

    .product-card {
      background: linear-gradient(135deg, var(--color-highlight), var(--color-bg));
      border: none;
      color: #fff;
      transition: transform 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .color-option {
      display: inline-block;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      margin-right: 6px;
      border: 2px solid #fff;
      cursor: pointer;
    }

    .product-image {
      max-height: 300px;
      object-fit: cover;
    }

    footer {
      background-color: var(--color-bg);
      color: var(--color-soft-pink);
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">Kyo's Delivery Service</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Ko-Fi</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Etsy</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Catalogue Section -->
  <div class="container py-5">
    <h2 class="text-center mb-4" style="color: var(--color-title);">Catalogue</h2>
    <div class="row g-4" id="catalogue-container"></div>
  </div>

  <!-- Footer -->
  <footer class="text-center py-4 mt-5">
    <p class="mb-0">&copy; 2025 Kyo's Delivery Service. All rights reserved.</p>
  </footer>

  <script>
    fetch('products.json')
      .then(res => res.json())
      .then(products => {
        const container = document.getElementById('catalogue-container');
        products.forEach(product => {
          const colors = product.colors.map(c =>
            `<span class="color-option" style="background-color: ${c};" title="${c}"></span>`
          ).join('');

          const card = `
            <div class="col-md-4">
              <div class="card product-card shadow-sm">
                <img src="img/${product.image}" class="product-image card-img-top" alt="${product.title}">
                <div class="card-body">
                  <h5 class="card-title mb-2">${product.title}</h5>
                  <p class="card-text small">${product.description}</p>
                  <div class="mb-2">
                    <span class="text-muted small">Colors:</span>
                    <div class="mt-1">${colors}</div>
                  </div>
                  <div class="mb-3">
                    <span class="h5 text-primary">$${product.price.toFixed(2)}</span>
                  </div>
                  <div class="d-grid gap-2">
                    <a href="${product.etsy}" target="_blank" class="btn btn-outline-light">
                      <i class="fab fa-etsy me-2"></i>Buy on Etsy
                    </a>
                    <a href="${product.kofi}" target="_blank" class="btn btn-outline-secondary">
                      <i class="fas fa-mug-hot me-2"></i>Buy on Ko-Fi
                    </a>
                  </div>
                </div>
              </div>
            </div>
          `;
          container.innerHTML += card;
        });
      });
  </script>
</body>

</html>
