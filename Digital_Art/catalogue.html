<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <title>Catalogue | Kyo's Delivery Service</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <style>
      :root {
        --color-bg: #212227;
        --color-accent: #c60f7b;
        --color-highlight: #b986cf;
        --color-primary: #09c8c9;
        --color-light: #5ad6f5;
        --color-title: #b4adea;
        --color-soft-pink: #bd5eb3;
        --color-purple: #c23797;
      }

      body {
        background-color: var(--color-bg);
        color: #ffffff;
      }

      /* =========================
           Navbar
        ========================= */

      .navbar {
        background-color: var(--color-bg);
      }

      .navbar-brand,
      .nav-link {
        color: var(--color-light) !important;
      }

      .navbar-brand:hover,
      .nav-link:hover {
        color: var(--color-accent) !important;
      }

      /* =========================
           Product Cards
        ========================= */

      .product-card {
        background: linear-gradient(
          135deg,
          var(--color-highlight),
          var(--color-bg)
        );

        border: none;
        color: #ffffff;

        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;

        height: 100%;
      }

      .product-card:hover {
        transform: translateY(-5px);
      }

      .card-body {
        display: flex;
        flex-direction: column;

        align-items: center;
        justify-content: space-evenly;

        text-align: center;
      }

      .product-image {
        width: 100%;
        max-height: 300px;

        object-fit: cover;

        margin-bottom: 1rem;
      }

      /* =========================
           Filters
        ========================= */

      .btn-filter {
        margin: 0.25rem;
      }

      .badge {
        font-size: 0.75rem;
      }

      /* =========================
           Footer
        ========================= */

      footer {
        background-color: var(--color-bg);
        color: var(--color-soft-pink);
      }
    </style>
  </head>

  <body>
    <!-- =========================
         Navbar
    ========================== -->

    <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
      <div class="container-fluid">
        <a
          class="navbar-brand fw-bold"
          href="https://it-z-kyoko.github.io/KyosDeliveryService/"
        >
          Kyo's Delivery Service
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a
                class="nav-link"
                href="https://it-z-kyoko.github.io/KyosDeliveryService/SocialMedia/Socials.html"
              >
                Social Media
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#"> Ko-Fi </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#"> Etsy </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#"> Contact </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- =========================
         Catalogue
    ========================== -->

    <main class="container py-5">
      <h2 class="text-center mb-4" style="color: var(--color-title)">
        Catalogue
      </h2>

      <!-- Search + Tag Filters -->

      <div class="text-center mb-4" id="tag-filters"></div>

      <!-- Products -->

      <div class="row g-4" id="catalogue-container"></div>
    </main>

    <!-- =========================
         Footer
    ========================== -->

    <footer class="text-center py-4 mt-5">
      <p class="mb-0">
        &copy; 2025 Kyo's Delivery Service. All rights reserved.
      </p>
    </footer>

    <!-- =========================
         JavaScript
    ========================== -->

    <script>
      let allProducts = [];
      let filteredProducts = [];

      let currentPage = 1;

      const productsPerPage = 6;

      /* ============================================================
           FILTERS
        ============================================================ */

      function renderFilters(tags) {
        const container = document.getElementById("tag-filters");

        /*
         * Remove duplicate tags
         */
        const uniqueTags = [...new Set(tags)];

        container.innerHTML = `

                <div class="mb-3">

                    <input
                        type="text"
                        class="form-control form-control-sm text-dark"
                        placeholder="Search by title or tag…"
                        id="searchBox"
                    >

                </div>


                <div class="d-flex flex-wrap justify-content-center">

                    <button
                        class="btn btn-sm btn-outline-light btn-filter m-1"
                        data-tag="all"
                    >
                        All
                    </button>


                    ${uniqueTags
                      .map(
                        (tag) => `

                        <button
                            class="btn btn-sm btn-outline-light btn-filter m-1"
                            data-tag="${tag}"
                        >
                            ${tag}
                        </button>

                    `,
                      )
                      .join("")}

                </div>
            `;

        /* =========================
               Search
            ========================== */

        document.getElementById("searchBox").addEventListener("input", (e) => {
          const term = e.target.value.toLowerCase();

          filteredProducts = allProducts.filter((product) => {
            const titleMatch = product.title.toLowerCase().includes(term);

            const tagMatch = product.tags.some((tag) =>
              tag.toLowerCase().includes(term),
            );

            return titleMatch || tagMatch;
          });

          currentPage = 1;

          renderPaginatedProducts();
        });

        /* =========================
               Tag Buttons
            ========================== */

        container.querySelectorAll(".btn-filter").forEach((btn) => {
          btn.addEventListener("click", () => {
            const tag = btn.getAttribute("data-tag");

            if (tag === "all") {
              filteredProducts = [...allProducts];
            } else {
              filteredProducts = allProducts.filter((product) =>
                product.tags.includes(tag),
              );
            }

            /*
             * Reset search field
             */
            document.getElementById("searchBox").value = "";

            currentPage = 1;

            renderPaginatedProducts();
          });
        });
      }

      /* ============================================================
           PRODUCTS
        ============================================================ */

      function renderPaginatedProducts() {
        const container = document.getElementById("catalogue-container");

        /*
         * Clear current cards
         */
        container.innerHTML = "";

        /*
         * Calculate products for current page
         */
        const start = (currentPage - 1) * productsPerPage;

        const end = start + productsPerPage;

        const pageProducts = filteredProducts.slice(start, end);

        /*
         * Render product cards
         */
        pageProducts.forEach((product) => {
          /*
           * Generate tag badges
           */
          const tags = product.tags
            .map(
              (tag) => `

                            <span
                                class="badge bg-secondary me-1 mb-1"
                            >
                                ${tag}
                            </span>

                        `,
            )
            .join("");

          /*
           * Product Card
           *
           * Etsy and Ko-Fi buttons have
           * been removed.
           */
          const card = `

                    <div class="col-md-6 col-lg-4 product-card-item">

                        <div
                            class="card product-card shadow-sm p-3"
                        >

                            <div class="card-body">


                                <!-- Title -->

                                <h5 class="card-title mb-3">

                                    ${product.title}

                                </h5>


                                <!-- Image -->

                                <img
                                    src="img/${product.image}"
                                    class="product-image img-fluid rounded"
                                    alt="${product.title}"
                                    onerror="
                                        this.onerror = null;
                                        this.src = 'img/ComingSoon.png';
                                    "
                                >


                                <!-- Description -->

                                <p class="card-text small">

                                    ${product.description}

                                </p>


                                <!-- Tags -->

                                <div class="mb-3">

                                    ${tags}

                                </div>


                                <!-- Price -->

                                <div>

                                    <span
                                        class="h5 text-primary"
                                    >

                                        ${product.price.toFixed(2)}€

                                    </span>

                                </div>


                            </div>

                        </div>

                    </div>

                `;

          container.innerHTML += card;
        });

        /*
         * Add pagination after products
         */
        renderPaginationControls();
      }

      /* ============================================================
           PAGINATION
        ============================================================ */

      function renderPaginationControls() {
        const container = document.getElementById("catalogue-container");

        const totalPages = Math.ceil(filteredProducts.length / productsPerPage);

        /*
         * No pagination required
         */
        if (totalPages <= 1) {
          return;
        }

        const paginationHTML = `

                <div
                    class="col-12 text-center mt-4"
                >

                    <button
                        class="btn btn-sm btn-outline-light me-2"
                        id="prevPage"
                        ${currentPage === 1 ? "disabled" : ""}
                    >
                        Previous
                    </button>


                    <span class="text-muted">

                        Page ${currentPage}
                        of ${totalPages}

                    </span>


                    <button
                        class="btn btn-sm btn-outline-light ms-2"
                        id="nextPage"
                        ${currentPage === totalPages ? "disabled" : ""}
                    >
                        Next
                    </button>

                </div>

            `;

        container.innerHTML += paginationHTML;

        /* =========================
               Previous Page
            ========================== */

        document.getElementById("prevPage")?.addEventListener("click", () => {
          if (currentPage > 1) {
            currentPage--;

            renderPaginatedProducts();
          }
        });

        /* =========================
               Next Page
            ========================== */

        document.getElementById("nextPage")?.addEventListener("click", () => {
          if (currentPage < totalPages) {
            currentPage++;

            renderPaginatedProducts();
          }
        });
      }

      /* ============================================================
           LOAD PRODUCTS.JSON
        ============================================================ */

      fetch("./products.json")
        .then((response) => {
          if (!response.ok) {
            throw new Error(`HTTP error: ${response.status}`);
          }

          return response.json();
        })

        .then((products) => {
          console.log("Products loaded:", products);

          allProducts = products;

          filteredProducts = [...products];

          /*
           * Collect all tags
           */
          const allTags = products.flatMap((product) => product.tags);

          renderFilters(allTags);

          renderPaginatedProducts();
        })

        .catch((error) => {
          console.error("Could not load products.json:", error);

          document.getElementById("catalogue-container").innerHTML = `

                    <div class="col-12">

                        <div
                            class="alert alert-danger text-center"
                        >

                            Could not load catalogue.

                        </div>

                    </div>

                `;
        });
    </script>

    <!-- Bootstrap JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
